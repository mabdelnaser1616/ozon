function OzonApp() {
  const [customers, setCustomers] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [page, setPage] = useState("dashboard"); // dashboard | details | maintenance
  const [selectedId, setSelectedId] = useState(null);
  const [centers, setCenters] = useState(DEFAULT_CENTERS);
  const [selectedCenter, setSelectedCenter] = useState(null);
  const [showCenterModal, setShowCenterModal] = useState(false);
  const [backPage, setBackPage] = useState("dashboard");
  const [search, setSearch] = useState("");

  const [showCustomerModal, setShowCustomerModal] = useState(false);
  const [editingCustomer, setEditingCustomer] = useState(null); // customer object or null (add mode)
  const [showVisitModal, setShowVisitModal] = useState(false);
  const [editingVisit, setEditingVisit] = useState(null); // visit object or null (add mode)
  const [activeAccountId, setActiveAccountId] = useState(MAIN_ACCOUNT_ID); // which account tab is open in the details page
  const [showAccountModal, setShowAccountModal] = useState(false);
  const [editingAccount, setEditingAccount] = useState(null); // extra-account object or null (add mode)
  const [confirmState, setConfirmState] = useState(null); // { type: 'customer'|'visit', ... }

  const [toasts, setToasts] = useState([]);
  const toastTimers = useRef({});

  const pushToast = useCallback((type, message) => {
    const id = uid();
    setToasts((t) => [...t, { id, type, message }]);
    toastTimers.current[id] = setTimeout(() => {
      setToasts((t) => t.filter((x) => x.id !== id));
      delete toastTimers.current[id];
    }, 3200);
  }, []);

  const fileInputRef = useRef(null);

  /* ---------- Google Sheets sync ---------- */
  const [sheetsCfg, setSheetsCfg] = useState(loadSheetsConfig);
  const [showSheetsModal, setShowSheetsModal] = useState(false);
  const [sheetStatus, setSheetStatus] = useState("idle"); // idle | syncing | ok | error
  const syncReadyRef = useRef(false);   // auto-push is allowed only after a successful pull/push
  const lastSyncedRef = useRef("");     // JSON of the data last known to match the sheet

  function persistSheetsCfg(cfg) {
    setSheetsCfg(cfg);
    try { window.localStorage.setItem(SHEETS_KEY, JSON.stringify(cfg)); } catch (e) {}
  }

  function handleSheetsSave(form) {
    persistSheetsCfg(form);
    setShowSheetsModal(false);
    pushToast("success", "تم حفظ إعدادات الربط.");
  }

  async function handleSheetsPull(form) {
    if (customers.length > 0 && !window.confirm("هيتم استبدال البيانات اللي على الجهاز ببيانات الشيت. متأكد؟")) return;
    persistSheetsCfg(form);
    setSheetStatus("syncing");
    try {
      const list = await sheetsPull(form.url, form.secret);
      setCustomers(list);
      lastSyncedRef.current = JSON.stringify(list);
      syncReadyRef.current = true;
      setSheetStatus("ok");
      pushToast("success", `تم جلب ${list.length} عميل من الشيت.`);
    } catch (e) {
      setSheetStatus("error");
      pushToast("error", "تعذر الجلب: " + e.message);
    }
  }

  async function handleSheetsPush(form) {
    if (customers.length === 0) { pushToast("error", "لا توجد بيانات لرفعها."); return; }
    if (!window.confirm("هيتم استبدال محتوى الشيت بالبيانات اللي على الجهاز. متأكد؟")) return;
    persistSheetsCfg(form);
    setSheetStatus("syncing");
    try {
      const n = await sheetsPush(form.url, form.secret, customers);
      lastSyncedRef.current = JSON.stringify(customers);
      syncReadyRef.current = true;
      setSheetStatus("ok");
      pushToast("success", `تم رفع ${n} عميل للشيت.`);
    } catch (e) {
      setSheetStatus("error");
      pushToast("error", "تعذر الرفع: " + e.message);
    }
  }

  // Auto mode: pull once when the app opens.
  useEffect(() => {
    if (!loaded || !sheetsCfg.auto || !sheetsCfg.url || !sheetsCfg.secret) return;
    let cancelled = false;
    (async () => {
      setSheetStatus("syncing");
      try {
        const list = await sheetsPull(sheetsCfg.url, sheetsCfg.secret);
        if (cancelled) return;
        if (list.length) {
          setCustomers(list);
          lastSyncedRef.current = JSON.stringify(list);
        }
        syncReadyRef.current = true;
        setSheetStatus("ok");
      } catch (e) {
        if (cancelled) return;
        setSheetStatus("error");
        pushToast("error", "تعذر الاتصال بالشيت: " + e.message);
      }
    })();
    return () => { cancelled = true; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded]);

  // Auto mode: push a moment after every change.
  useEffect(() => {
    if (!loaded || !sheetsCfg.auto || !sheetsCfg.url || !sheetsCfg.secret) return;
    if (!syncReadyRef.current || customers.length === 0) return;
    const json = JSON.stringify(customers);
    if (json === lastSyncedRef.current) return;
    const t = setTimeout(async () => {
      setSheetStatus("syncing");
      try {
        await sheetsPush(sheetsCfg.url, sheetsCfg.secret, customers);
        lastSyncedRef.current = json;
        setSheetStatus("ok");
      } catch (e) {
        setSheetStatus("error");
        pushToast("error", "تعذر الرفع للشيت: " + e.message);
      }
    }, 2500);
    return () => clearTimeout(t);
  }, [customers, loaded, sheetsCfg, pushToast]);

  // Load persisted data on mount (from the browser's local storage on this device).
  useEffect(() => {
    try {
      const raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) setCustomers(parsed);
      }
    } catch (e) {
      // corrupted or missing data — start empty
    } finally {
      setLoaded(true);
    }
  }, []);

  // Persist whenever data changes (after initial load), so closing/reopening the tab keeps the data.
  useEffect(() => {
    if (!loaded) return;
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(customers));
    } catch (e) {
      pushToast("error", "تعذر حفظ البيانات محليًا، حاول مرة أخرى.");
    }
  }, [customers, loaded, pushToast]);

  // Custom centers (added by the user) are stored next to the 10 built-in ones.
  const [centersLoaded, setCentersLoaded] = useState(false);
  useEffect(() => {
    try {
      const raw = window.localStorage.getItem(CENTERS_KEY);
      if (raw) {
        const extra = JSON.parse(raw);
        if (Array.isArray(extra)) setCenters([...DEFAULT_CENTERS, ...extra.filter((x) => x && x.letter && !DEFAULT_CENTERS.some((d) => d.letter === x.letter)).map((x) => ({ ...x, custom: true }))]);
      }
    } catch (e) {}
    setCentersLoaded(true);
  }, []);
  useEffect(() => {
    if (!centersLoaded) return;
    try {
      window.localStorage.setItem(CENTERS_KEY, JSON.stringify(centers.filter((c) => c.custom).map(({ letter, name }) => ({ letter, name }))));
    } catch (e) {}
  }, [centers, centersLoaded]);

  function saveCenter(c) {
    setCenters((cs) => [...cs, { ...c, custom: true }]);
    setShowCenterModal(false);
    pushToast("success", `تم إضافة مركز ${c.name}.`);
  }

  function openCenter(letter) {
    setSelectedCenter(letter);
    setSelectedId(null);
    setPage("center");
  }

  function deleteCenter() {
    setCenters((cs) => cs.filter((c) => c.letter !== selectedCenter));
    setSelectedCenter(null);
    setPage("dashboard");
    pushToast("success", "تم حذف المركز.");
  }

  /* ---------- Excel export / import ---------- */

  function handleExportExcel() {
    if (customers.length === 0) {
      pushToast("error", "لا توجد بيانات لتصديرها بعد.");
      return;
    }
    try {
      exportCustomersToExcel(customers);
      pushToast("success", "تم تصدير ملف Excel بنجاح.");
    } catch (e) {
      pushToast("error", "تعذر تصدير ملف Excel.");
    }
  }

  function handleImportClick() {
    fileInputRef.current?.click();
  }

  const [pendingImport, setPendingImport] = useState(null); // staged parsed customers, waiting for merge/replace choice

  async function handleImportFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = ""; // allow re-selecting the same file later
    if (!file) return;
    try {
      const imported = await importCustomersFromExcel(file);
      if (imported.length === 0) {
        pushToast("error", "لم يتم العثور على بيانات عملاء صالحة في الملف.");
        return;
      }
      setPendingImport(imported);
    } catch (err) {
      pushToast("error", "تعذر قراءة ملف Excel. تأكد أنه بنفس تنسيق التصدير.");
    }
  }

  const jsonFileInputRef = useRef(null);

  function handleExportJSON() {
    if (customers.length === 0) {
      pushToast("error", "لا توجد بيانات لتصديرها بعد.");
      return;
    }
    try {
      exportCustomersToJSON(customers);
      pushToast("success", "تم تصدير ملف JSON بنجاح.");
    } catch (e) {
      pushToast("error", "تعذر تصدير ملف JSON.");
    }
  }

  function handleImportJSONClick() {
    jsonFileInputRef.current?.click();
  }

  async function handleImportJSONFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    try {
      const imported = await importCustomersFromJSON(file);
      if (imported.length === 0) {
        pushToast("error", "لم يتم العثور على بيانات عملاء صالحة في الملف.");
        return;
      }
      setPendingImport(imported);
    } catch (err) {
      pushToast("error", "تعذر قراءة ملف JSON. تأكد أنه بنفس تنسيق التصدير.");
    }
  }

  const selectedCustomer = useMemo(
    () => customers.find((c) => c.id === selectedId) || null,
    [customers, selectedId]
  );

  /* ---------- Import mode (merge vs replace) ---------- */

  function handleImportMerge() {
    if (!pendingImport) return;
    const withCodes = ensureUniqueCodes(customers, pendingImport);
    setCustomers((cs) => [...withCodes, ...cs]);
    pushToast("success", `تم دمج ${withCodes.length} عميل مع البيانات الحالية.`);
    setPendingImport(null);
  }

  function handleImportReplace() {
    if (!pendingImport) return;
    const withCodes = ensureUniqueCodes([], pendingImport);
    setCustomers(withCodes);
    pushToast("success", `تم استبدال البيانات بـ ${withCodes.length} عميل من الملف.`);
    setPendingImport(null);
  }

  function handleImportCancel() {
    setPendingImport(null);
  }

  /* ---------- Customer handlers ---------- */

  function openAddCustomer() {
    setEditingCustomer(null);
    setShowCustomerModal(true);
  }

  function openEditCustomer(customer) {
    setEditingCustomer(customer);
    setShowCustomerModal(true);
  }

  function saveCustomer(form) {
    if (editingCustomer) {
      const code = (form.code && form.code.trim()) || editingCustomer.code;
      setCustomers((cs) => cs.map((c) => (c.id === editingCustomer.id ? { ...c, ...form, code } : c)));
      pushToast("success", "تم تحديث بيانات العميل بنجاح.");
    } else {
      const code = (form.code && form.code.trim()) || (selectedCenter && selectedCenter !== UNCLASSIFIED ? nextCodeForCenter(customers, selectedCenter) : nextCustomerCode(customers));
      const newCustomer = { id: uid(), ...form, code, visits: [] };
      setCustomers((cs) => [newCustomer, ...cs]);
      setSelectedId(newCustomer.id);
      setActiveAccountId(MAIN_ACCOUNT_ID);
      setBackPage(page === "center" ? "center" : "dashboard");
      setPage("details");
      pushToast("success", "تم إضافة العميل بنجاح.");
    }
    setShowCustomerModal(false);
    setEditingCustomer(null);
  }

  function requestDeleteCustomer(customer) {
    setConfirmState({
      type: "customer",
      title: "حذف العميل",
      message: `هل أنت متأكد من حذف "${customer.name}"؟ سيتم حذف جميع مواعيد الصيانة الخاصة به نهائيًا.`,
      onConfirm: () => {
        setCustomers((cs) => cs.filter((c) => c.id !== customer.id));
        setConfirmState(null);
        setPage(backPage);
        setSelectedId(null);
        pushToast("success", "تم حذف العميل.");
      },
    });
  }

  /* ---------- Visit handlers ---------- */

  function openAddVisit() {
    setEditingVisit(null);
    setShowVisitModal(true);
  }

  function openEditVisit(visit) {
    setEditingVisit(visit);
    setShowVisitModal(true);
  }

  function saveVisit(form) {
    if (!selectedCustomer) return;
    if (editingVisit) {
      setCustomers((cs) =>
        cs.map((c) =>
          c.id === selectedCustomer.id
            ? mapAccountVisits(c, activeAccountId, (vs) => vs.map((v) => (v.id === editingVisit.id ? { ...v, ...form } : v)))
            : c
        )
      );
      pushToast("success", "تم تحديث موعد الصيانة.");
    } else {
      const newVisit = { id: uid(), ...form };
      setCustomers((cs) =>
        cs.map((c) => (c.id === selectedCustomer.id ? mapAccountVisits(c, activeAccountId, (vs) => [...vs, newVisit]) : c))
      );
      pushToast("success", "تم إضافة موعد الصيانة.");
    }
    setShowVisitModal(false);
    setEditingVisit(null);
  }

  function requestDeleteVisit(visit) {
    setConfirmState({
      type: "visit",
      title: "حذف موعد الصيانة",
      message: "هل أنت متأكد من حذف موعد الصيانة؟",
      onConfirm: () => {
        setCustomers((cs) =>
          cs.map((c) =>
            c.id === selectedCustomer.id ? mapAccountVisits(c, activeAccountId, (vs) => vs.filter((v) => v.id !== visit.id)) : c
          )
        );
        setConfirmState(null);
        pushToast("success", "تم حذف موعد الصيانة.");
      },
    });
  }

  /* ---------- Extra account handlers (a customer with more than one filter) ---------- */

  function openAddAccount() {
    setEditingAccount(null);
    setShowAccountModal(true);
  }

  function openEditAccount(account) {
    // Use the raw stored account (not the display copy) so an empty name stays empty.
    const raw = (selectedCustomer?.accounts || []).find((a) => a.id === account.id);
    if (!raw) return;
    setEditingAccount(raw);
    setShowAccountModal(true);
  }

  function saveAccount(form) {
    if (!selectedCustomer) return;
    const clean = {
      label: (form.label || "").trim(),
      address: (form.address || "").trim(),
      deviceType: (form.deviceType || "").trim(),
      purchaseDate: form.purchaseDate || "",
      technician: (form.technician || "").trim(),
    };
    if (editingAccount) {
      setCustomers((cs) =>
        cs.map((c) =>
          c.id === selectedCustomer.id
            ? { ...c, accounts: (c.accounts || []).map((a) => (a.id === editingAccount.id ? { ...a, ...clean } : a)) }
            : c
        )
      );
      pushToast("success", "تم تحديث الحساب.");
    } else {
      const newAccount = { id: uid(), ...clean, visits: [] };
      setCustomers((cs) =>
        cs.map((c) => (c.id === selectedCustomer.id ? { ...c, accounts: [...(c.accounts || []), newAccount] } : c))
      );
      setActiveAccountId(newAccount.id);
      pushToast("success", "تم إضافة الحساب الجديد.");
    }
    setShowAccountModal(false);
    setEditingAccount(null);
  }

  function requestDeleteAccount(account) {
    const n = (account.visits || []).length;
    setConfirmState({
      type: "account",
      title: "حذف الحساب",
      message: `هل أنت متأكد من حذف "${account.label}"؟${n > 0 ? ` سيتم حذف ${n} من مواعيد الصيانة الخاصة به نهائيًا.` : ""}`,
      onConfirm: () => {
        setCustomers((cs) =>
          cs.map((c) => (c.id === selectedCustomer.id ? { ...c, accounts: (c.accounts || []).filter((a) => a.id !== account.id) } : c))
        );
        setActiveAccountId(MAIN_ACCOUNT_ID);
        setConfirmState(null);
        pushToast("success", "تم حذف الحساب.");
      },
    });
  }

  function goToCustomer(id, accountId) {
    setSelectedId(id);
    setActiveAccountId(accountId || MAIN_ACCOUNT_ID);
    const target = customers.find((c) => c.id === id);
    if (page !== "details") setBackPage(page);
    if (target && page === "dashboard") { /* opened from home lists */ }
    setPage("details");
  }

  return (
    <div className="ozon-root">
      <GlobalStyles />
      <Waves />
      <div className="container">
        <div className="topbar">
          <div className="brand">
            <div className="brand-mark"><Droplets size={22} /></div>
            <div className="brand-text">
              <h1>أوزون لحلول تنقية المياه</h1>
              <span>نظام إدارة العملاء والصيانة</span>
            </div>
          </div>
          <div className="nav-tabs">
            <button className={`nav-tab ${page !== "maintenance" ? "active" : ""}`} onClick={() => { setSelectedId(null); setSelectedCenter(null); setPage("dashboard"); }}>
              <MapPin size={15} /> المراكز
            </button>
            <button className={`nav-tab ${page === "maintenance" ? "active" : ""}`} onClick={() => setPage("maintenance")}>
              <Wrench size={15} /> مواعيد الصيانة
            </button>
          </div>

          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <input
              ref={fileInputRef}
              type="file"
              accept=".xlsx,.xls"
              style={{ display: "none" }}
              onChange={handleImportFile}
            />
            <input
              ref={jsonFileInputRef}
              type="file"
              accept=".json,application/json"
              style={{ display: "none" }}
              onChange={handleImportJSONFile}
            />
            <button className="btn btn-ghost btn-sm" onClick={handleImportClick} title="استيراد بيانات من ملف Excel">
              <Upload size={14} /> استيراد Excel
            </button>
            <button className="btn btn-ghost btn-sm" onClick={handleExportExcel} title="تصدير كل البيانات إلى ملف Excel">
              <Download size={14} /> تصدير Excel
            </button>
            <button className="btn btn-ghost btn-sm" onClick={handleImportJSONClick} title="استيراد بيانات من ملف JSON (نسخة احتياطية كاملة)">
              <Upload size={14} /> استيراد JSON
            </button>
            <button className="btn btn-ghost btn-sm" onClick={handleExportJSON} title="تصدير كل البيانات إلى ملف JSON (نسخة احتياطية كاملة)">
              <Download size={14} /> تصدير JSON
            </button>
            <button className="btn btn-primary btn-sm" onClick={() => setShowSheetsModal(true)} title="الربط مع Google Sheets">
              <Cloud size={14} /> جوجل شيت {sheetStatus === "ok" ? "✓" : sheetStatus === "error" ? "⚠" : sheetStatus === "syncing" ? "…" : ""}
            </button>
          </div>
        </div>

        {page === "dashboard" && (
          <HomePage
            customers={customers}
            centers={centers}
            onOpenCenter={openCenter}
            onOpenCustomer={goToCustomer}
            onAddCenter={() => setShowCenterModal(true)}
          />
        )}

        {page === "center" && selectedCenter && (() => {
          const center = centers.find((c) => c.letter === selectedCenter) || { letter: UNCLASSIFIED, name: "بدون مركز", virtual: true };
          const list = customers.filter((c) => centerKey(c, centers) === center.letter);
          return (
            <CenterPage
              center={center}
              customers={list}
              onBack={() => { setSelectedCenter(null); setPage("dashboard"); }}
              onOpenCustomer={goToCustomer}
              onAddCustomer={openAddCustomer}
              onDeleteCenter={deleteCenter}
            />
          );
        })()}

        {page === "details" && selectedCustomer && (
          <CustomerDetailsPage
            customer={selectedCustomer}
            activeAccountId={activeAccountId}
            onSelectAccount={setActiveAccountId}
            onBack={() => { setPage(backPage); setSelectedId(null); setActiveAccountId(MAIN_ACCOUNT_ID); }}
            onEditCustomer={() => openEditCustomer(selectedCustomer)}
            onDeleteCustomer={() => requestDeleteCustomer(selectedCustomer)}
            onAddAccount={openAddAccount}
            onEditAccount={openEditAccount}
            onDeleteAccount={requestDeleteAccount}
            onAddVisit={openAddVisit}
            onEditVisit={openEditVisit}
            onDeleteVisit={requestDeleteVisit}
          />
        )}

        {page === "maintenance" && (
          <MaintenancePage customers={customers} onOpenCustomer={goToCustomer} />
        )}

        {showCustomerModal && (
          <CustomerModal
            initial={editingCustomer}
            suggestedCode={editingCustomer ? editingCustomer.code : (selectedCenter && selectedCenter !== UNCLASSIFIED ? nextCodeForCenter(customers, selectedCenter) : nextCustomerCode(customers))}
            onSave={saveCustomer}
            onClose={() => { setShowCustomerModal(false); setEditingCustomer(null); }}
          />
        )}

        {showCenterModal && (
          <CenterModal centers={centers} onSave={saveCenter} onClose={() => setShowCenterModal(false)} />
        )}

        {showAccountModal && selectedCustomer && (
          <AccountModal
            initial={editingAccount}
            defaultAddress={selectedCustomer.address}
            onSave={saveAccount}
            onClose={() => { setShowAccountModal(false); setEditingAccount(null); }}
          />
        )}

        {showVisitModal && (
          <VisitModal
            initial={editingVisit}
            onSave={saveVisit}
            onClose={() => { setShowVisitModal(false); setEditingVisit(null); }}
          />
        )}

        {confirmState && (
          <ConfirmModal
            title={confirmState.title}
            message={confirmState.message}
            onConfirm={confirmState.onConfirm}
            onCancel={() => setConfirmState(null)}
          />
        )}

        {pendingImport && (
          <ImportModeModal
            count={pendingImport.length}
            onMerge={handleImportMerge}
            onReplace={handleImportReplace}
            onCancel={handleImportCancel}
          />
        )}

        {showSheetsModal && (
          <SheetsModal
            config={sheetsCfg}
            status={sheetStatus}
            count={customers.length}
            onSave={handleSheetsSave}
            onPull={handleSheetsPull}
            onPush={handleSheetsPush}
            onClose={() => setShowSheetsModal(false)}
          />
        )}

        <div className="toast-stack">
          {toasts.map((t) => <Toast key={t.id} toast={t} />)}
        </div>
      </div>
    </div>
  );
}

const rootEl = document.getElementById("root");
createRoot(rootEl).render(<OzonApp />);

</script>
</body>
</html>
